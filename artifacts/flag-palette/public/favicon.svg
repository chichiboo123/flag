<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="#0F172A"/>
  <!-- Globe circle base -->
  <circle cx="32" cy="32" r="23" fill="#1E3A5F"/>
  <!-- Horizontal flag-color stripes clipped to globe -->
  <defs>
    <clipPath id="globe-clip">
      <circle cx="32" cy="32" r="23"/>
    </clipPath>
  </defs>
  <g clip-path="url(#globe-clip)">
    <rect x="9" y="9" width="46" height="9.2" fill="#EF4444"/>
    <rect x="9" y="18.2" width="46" height="9.2" fill="#F8FAFC"/>
    <rect x="9" y="27.4" width="46" height="9.2" fill="#3B82F6"/>
    <rect x="9" y="36.6" width="46" height="9.2" fill="#22C55E"/>
    <rect x="9" y="45.8" width="46" height="9.2" fill="#EAB308"/>
    <!-- Equator line hint -->
    <line x1="9" y1="32" x2="55" y2="32" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
    <!-- Meridian line hint -->
    <ellipse cx="32" cy="32" rx="13" ry="23" stroke="rgba(255,255,255,0.12)" stroke-width="1.2" fill="none"/>
  </g>
  <!-- Globe border -->
  <circle cx="32" cy="32" r="23" stroke="#475569" stroke-width="1.5" fill="none"/>
</svg>
